name: Keep-warm ping

# Pings the production health endpoint every 5 minutes during West African
# hours (06:00-23:00 GMT) so the Neon Postgres compute never cold-starts for
# the first reader of the day. Overridable via the PRODUCTION_URL repo variable.
on:
  schedule:
    - cron: "*/5 6-23 * * *"
  workflow_dispatch:

env:
  PRODUCTION_URL: ${{ vars.PRODUCTION_URL || 'https://slnews.sl' }}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /api/health
        run: |
          curl -fsS --max-time 20 --retry 2 "$PRODUCTION_URL/api/health" \
            && echo "Warm-up ping OK" \
            || (echo "Warm-up ping failed" >&2 && exit 1)
